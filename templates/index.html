{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body>

  <header class="navbar">
    <a href="#" class="logo">SaLink</a>

      <ul>

    <a href="{% if user.is_authenticated %}{% url 'user_page:profile' %}{% else %}{% url 'user_page:login' %}?next={{ request.get_full_path|urlencode }}{% endif %}" class="profile">
      <span>{% if user.is_authenticated %}{{ user.username }}{% else %}Masuk{% endif %}</span>
      <div class="avatar"></div>
    </a>
  </header>

  <section class="hero">
