{# Satu baris jadwal: jam, asal, tujuan, harga. Dipakai juga untuk empty_form (template JS). #}
<div class="jadwal-tebeng">
  <label class="pill pill--sm"><span class="sr-only">Lokasi asal</span>{{ form.origin }}</label>
  {{ form.origin.errors }}
  <label class="pill pill--sm"><span class="sr-only">Lokasi tujuan</span>{{ form.destination }}</label>
  {{ form.destination.errors }}
  <label class="pill pill--sm"><span class="sr-only">Jam</span>{{ form.time }}</label>
  {{ form.time.errors }}
  <label class="pill pill--sm"><span class="sr-only">Harga</span>{{ form.price }}</label>
</div>
