<header class="navbar">
  <a href="/" class="navbar__logo">SaLink</a>

  <nav class="navbar__menu" aria-label="Navigasi utama">
    <a href="/" {% if active_nav == 'home' %}class="is-active" aria-current="page"{% endif %}>HOME</a>
    <a href="{% url 'saling_beli:index' %}" {% if active_nav == 'beli' %}class="is-active" aria-current="page"{% endif %}>BELI</a>
    <a href="/saling-tebeng/" {% if active_nav == 'tebeng' %}class="is-active" aria-current="page"{% endif %}>NEBENG</a>
    <a href="{% url 'saling_bagi:index' %}" {% if active_nav == 'bagi' %}class="is-active" aria-current="page"{% endif %}>BAGI</a>
    <a href="{% url 'saling_pinjam:item_list' %}" {% if active_nav == 'pinjam' %}class="is-active" aria-current="page"{% endif %}>PINJAM</a>
  </nav>

  <div class="navbar__profile">
    {% if user.is_authenticated %}
      <a class="navbar__account" href="{% url 'user_page:profile' %}">{{ user.username }}</a>
      <form method="post" action="{% url 'user_page:logout' %}" style="display: inline; margin: 0;">
        {% csrf_token %}
        <button class="navbar__logout" type="submit" aria-label="Keluar" title="Keluar">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
            <path d="M10 17l5-5-5-5M15 12H3m9-7h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    {% else %}
      <a class="navbar__account" href="{% url 'user_page:login' %}?next={{ request.get_full_path|urlencode }}">Masuk</a>
      <a class="navbar__account navbar__account--accent" href="{% url 'user_page:register' %}">Daftar</a>
    {% endif %}
    <a class="navbar__avatar-link" href="{% if user.is_authenticated %}{% url 'user_page:profile' %}{% else %}{% url 'user_page:login' %}?next={{ request.get_full_path|urlencode }}{% endif %}" aria-label="Profil akun">
      <svg class="navbar__avatar" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4" fill="currentColor"/>
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="currentColor"/>
      </svg>
    </a>
  </div>
</header>
