
{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaLink - Saling Bagi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="{% static 'style.css' %}?v=20261027_04">
    <link rel="stylesheet" href="{% static 'navbar-footer.css' %}">
    <link rel="stylesheet" href="{% static 'saling_bagi/saling_bagi.css' %}">
</head>
<body>

    {% include "_navbar.html" with active_nav="bagi" %}

      <main class="bagi">
        <h2 class="section-title">Bagikan Makanan</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}
                <div class="bagi__form-row">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <p class="bagi__error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="food-card__button">
                Bagikan Makanan
            </button>
        </form>

        <p class="bagi__back">
            <a href="{% url 'saling_bagi:index' %}">
                Kembali ke Saling Bagi
            </a>
        </p>
    </main>

</body>
</html>
