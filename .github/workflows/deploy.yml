name: Deploy to PWS

on:
  push:
    branches:
      - main

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to PWS
        env:
          # Pastikan tulisan 'salink' di ujung URL sesuai dengan nama proyek yang didaftarkan temen lu di PWS
          PWS_URL: https://${{ secrets.PWS_USERNAME }}:${{ secrets.PWS_TOKEN }}@pbp.cs.ui.ac.id/${{ secrets.PWS_USERNAME }}/salink
        run: |
          git remote add pws $PWS_URL
          git branch -M main
          git push pws main